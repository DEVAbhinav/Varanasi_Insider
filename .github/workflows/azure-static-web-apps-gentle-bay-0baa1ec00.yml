name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_CC_EMAIL: ${{ secrets.RESEND_CC_EMAIL }}
          NEXT_PUBLIC_WEBSITE_LEAD_ERP_URL: ${{ secrets.NEXT_PUBLIC_WEBSITE_LEAD_ERP_URL }}
          NEXT_PUBLIC_WEBSITE_LEAD_API_KEY: ${{ secrets.NEXT_PUBLIC_WEBSITE_LEAD_API_KEY }}

      - name: Optimize Azure artifact
        run: |
          rm -rf .next/cache .next/standalone
          rm -rf public/images/sales-visuals
          find .next -name "*.map" -type f -delete
          find .next -name "*.nft.json" -type f -delete
          echo "Azure artifact size:"
          du -sh .next
          echo "Public asset size:"
          du -sh public
      
      - name: Deploy to Azure
        id: builddeploy
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_BAY_0BAA1EC00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_BAY_0BAA1EC00 }}
          action: "close"
