<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
  <title id="title">Bharat Milap Procession Route Map</title>
  <desc id="desc">Simplified procession map from Ramnagar Fort to Nati Imli highlighting crowd pinch points and recommended parking zones.</desc>
  <rect width="360" height="220" fill="#f7f3ef"/>
  <path d="M40 180 L80 140 L130 120 L200 100 L260 80 L320 70" stroke="#c2410c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="180" r="9" fill="#1d4ed8"/>
  <circle cx="320" cy="70" r="9" fill="#16a34a"/>
  <text x="26" y="205" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#1d4ed8">Start: Ramnagar Fort</text>
  <text x="265" y="55" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#166534">Nati Imli Stage</text>
  <text x="105" y="150" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#991b1b">Godowlia pinch point</text>
  <text x="210" y="118" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#92400e">Cheeta Gate Barricade</text>
  <text x="140" y="200" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#0f172a">Recommended parking & shuttle</text>
  <rect x="250" y="160" width="90" height="46" rx="6" fill="#0f172a" opacity="0.08"/>
  <text x="260" y="178" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#0f172a">Hold zone:</text>
  <text x="260" y="194" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Dhobi Ghat</text>
</svg>